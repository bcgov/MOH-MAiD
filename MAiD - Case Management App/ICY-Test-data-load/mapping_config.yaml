  # ==================================================================
  # UPDATE PASSES - back-fill the Case/Referral/Intake links that were
  # deliberately left blank on the initial inserts above, now that Case
  # exists. Each re-loads the SAME source CSV, resolves the newly-possible
  # lookups, then updates (not inserts) by matching against that object's
  # own reference table captured during its insert stage above.
  # ==================================================================
  - name: Case_Contact_Update
    type: update
    input_csv: data/ICY_CaseContact.csv
    sobject: Case_Contact__c
    match_against_reference: case_contact
    match_key_column: OLD_ID
    lookups:
      - source_column: OLD_CASE
        target_column: Case__c   # real API name confirmed via org describe
        reference: case
        drop_source: true
      - source_column: OLD_REFERRAL
        target_column: Referral__c   # real API name confirmed via org describe
        reference: referral
        drop_source: true
      - source_column: OLD_INTAKE
        target_column: Intake__c   # real API name confirmed via org describe
        reference: intake
        drop_source: true

  - name: Referral_Update
    type: update
    input_csv: data/ICY_Referral.csv
    sobject: Referral__c
    match_against_reference: referral
    match_key_column: OLD_ID
    # Same picklist fix as the initial Referral insert stage - this stage
    # reloads the SAME source CSV independently, so the fix doesn't carry
    # over automatically; confirmed the same 4 rows fail here too without it.
    value_remap:
      ICY_PREFERRED_METHOD_OF_CONTACT__C:
        Other: Other Phone
    # This stage reuses ICY_Referral.csv, which still carries several helper/
    # stale columns that were already resolved during the initial Referral
    # insert:
    #   - OLD_ICY_REFERRED_BY__C (Case Contact) / OWNER:Group-Name /
    #     RecordType:RecordType-Name - lookup/special_lookup helper columns,
    #     not real Salesforce fields at all.
    #   - ICY_REFERRED_BY__C - IS a real field, but holds the SAME stale raw
    #     OLD-org Case_Contact Id the initial insert already correctly
    #     resolved once via the helper column above - re-sending it here
    #     would overwrite the correct value with a stale, inaccessible one
    #     ("INSUFFICIENT_ACCESS_ON_CROSS_REFERENCE_ENTITY", confirmed live).
    # None of these are re-declared on this stage, so they must be dropped
    # here too or the update either chokes on an unrecognized column name
    # (the first three) or corrupts already-correct data (the last one).
    drop_columns:
      - "OLD_ICY_REFERRED_BY__C (Case Contact)"
      - "OWNER:Group-Name"
      - "RecordType:RecordType-Name"
      - ICY_REFERRED_BY__C
    lookups:
      - source_column: OLD_CASE
        target_column: Case__c   # real API name confirmed via org describe
        reference: case
        drop_source: true

  - name: Intake_Update
    type: update
    input_csv: data/ICY_Intake.csv
    sobject: Intake__c
    match_against_reference: intake
    match_key_column: ID
    lookups:
      - source_column: CASE__C   # holds the OLD-org Case id directly, same pattern as Intake's own REFERRAL__C at insert time
        target_column: Case__c   # real API name confirmed via org describe
        reference: case
        # Same reasoning as Intake's REFERRAL__C above - without this, the
        # stale raw CASE__C column collides case-insensitively with the
        # newly-resolved Case__c column at the Bulk API layer.
        drop_source: true
    # Same CREATEDBYID/LASTMODIFIEDBYID/ICY_ASSIGNED_TO__C/ICY_WHO_IS_DOING__C
    # issue as the initial Intake insert stage above - this update pass
    # reuses the same source CSV, so the same stale User Id columns are
    # present here too.
    # REFERRAL__C is the same "already correctly resolved once, don't
    # re-send the stale raw value" issue as Referral_Update's
    # ICY_REFERRED_BY__C above - the initial Intake insert already resolved
    # this via its own REFERRAL__C -> Referral__c lookup (drop_source:
    # true), but that only affected THAT run's dataframe, not this stage's
    # fresh reload of the same CSV - re-sending it here would overwrite the
    # correct value with a stale OLD-org Referral Id.
    drop_columns:
      - CREATEDBYID
      - LASTMODIFIEDBYID
      - ICY_ASSIGNED_TO__C
      - ICY_WHO_IS_DOING__C
      - REFERRAL__C
