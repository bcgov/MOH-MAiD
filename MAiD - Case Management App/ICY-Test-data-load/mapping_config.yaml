    lookups:
      - source_column: OLD_ICY_CASE_CONTACT
        target_column: ICY_Case_Contact__c   # real API name confirmed via org describe
        reference: case_contact
        drop_source: true
      - source_column: OLD_TRANSITION_NEEDS
        target_column: Transition_Needs__c   # real API name confirmed via org describe
        reference: have_and_needs
        drop_source: true
    # ASSIGNED_CASE_TEAM_MEMBER__C intentionally left blank per the procedure
    # ("For now keep it blank") - OLD_ASSIGNED_CASE_TEAM_MEMBER is simply
    # not mapped to anything, but it IS populated in 50/79 rows and isn't a
